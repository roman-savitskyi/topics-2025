<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Available Branches</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        a {
            color: #0366d6;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Available Presentation Branches</h1>
    <ul id="branches"></ul>
    <script>
        const branches = [];
        branches.push({ name: 'assets', original: 'assets' });
        branches.push({ name: 'feature-cognitive-webaccessibility', original: 'feature/cognitive-webaccessibility' });
        branches.push({ name: 'feature-fw-days-chrome-dev-tools', original: 'feature/fw-days-chrome-dev-tools' });
        branches.push({ name: 'feature-km-ai', original: 'feature/km-ai' });
        branches.push({ name: 'feature-speach-phd', original: 'feature/speach-phd' });
        branches.push({ name: 'feature-test-biology', original: 'feature/test-biology' });
        branches.push({ name: 'main', original: 'main' });
        const ul = document.getElementById('branches');
        branches.sort((a, b) => a.original.localeCompare(b.original));
        branches.forEach(branch => {
            const li = document.createElement('li');
            li.innerHTML = '<a href="/topics-2025/' + branch.name + '/">' + branch.original + '</a>';
            ul.appendChild(li);
        });
        if (branches.length === 0) {
            ul.innerHTML = '<li>Поки що немає доступних гілок</li>';
        }
    </script>
</body>
</html>
