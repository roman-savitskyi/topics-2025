name: Deploy Branches to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build presentation
        run: npm run build

      - name: Prepare deployment
        run: |
          # Отримуємо назву гілки
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Branch name: $BRANCH_NAME"

          # Конвертуємо назву гілки в URL-friendly формат (feature/1 -> feature-1)
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
          echo "Clean branch name: $CLEAN_BRANCH"

          # Зберігаємо для наступних кроків
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "CLEAN_BRANCH=$CLEAN_BRANCH" >> $GITHUB_ENV

      - name: Checkout gh-pages branch
        run: |
          # Клонуємо gh-pages гілку в окрему папку
          git clone --branch gh-pages https://github.com/${{ github.repository }} gh-pages-repo 2>/dev/null || {
            # Якщо gh-pages не існує, створюємо нову
            mkdir gh-pages-repo
            cd gh-pages-repo
            git init
            git checkout -b gh-pages
            echo "# GitHub Pages Deployments" > README.md
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add README.md
            git commit -m "Initialize gh-pages"
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git push -u origin gh-pages
            cd ..
          }

      - name: Copy build to gh-pages
        run: |
          # Створюємо/оновлюємо папку для гілки
          mkdir -p gh-pages-repo/${{ env.CLEAN_BRANCH }}

          # Копіюємо всі файли презентації в папку гілки
          cp -r *.html gh-pages-repo/${{ env.CLEAN_BRANCH }}/ 2>/dev/null || true
          cp -r css gh-pages-repo/${{ env.CLEAN_BRANCH }}/ 2>/dev/null || true
          cp -r js gh-pages-repo/${{ env.CLEAN_BRANCH }}/ 2>/dev/null || true
          cp -r dist gh-pages-repo/${{ env.CLEAN_BRANCH }}/ 2>/dev/null || true
          cp -r plugin gh-pages-repo/${{ env.CLEAN_BRANCH }}/ 2>/dev/null || true
          cp -r examples gh-pages-repo/${{ env.CLEAN_BRANCH }}/ 2>/dev/null || true

      - name: Generate index page
        run: |
          cd gh-pages-repo

          # Збираємо список всіх задеплоєних гілок (директорії, крім прихованих)
          ITEMS=""
          for dir in $(ls -d */ 2>/dev/null | sort); do
            branch="${dir%/}"
            # Конвертуємо назву директорії назад у читабельний вигляд (feature-km-ai → feature/km-ai)
            display=$(echo "$branch" | sed 's/-/\//2')
            ITEMS="${ITEMS}      <li><a href=\"${branch}/\">${display}</a></li>\n"
          done

          cat > index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="uk">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Presentations — Roman Savitskyi</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                min-height: 100vh;
                background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
                color: #c9d1d9;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
              }
              .container {
                width: 100%;
                max-width: 680px;
              }
              h1 {
                font-size: 1.6rem;
                font-weight: 600;
                color: #00d9ff;
                border-bottom: 1px solid #30363d;
                padding-bottom: 16px;
                margin-bottom: 32px;
                letter-spacing: -0.02em;
              }
              ul {
                list-style: none;
              }
              li {
                margin-bottom: 10px;
              }
              a {
                display: block;
                padding: 14px 20px;
                background: rgba(255,255,255,0.04);
                border: 1px solid #30363d;
                border-radius: 8px;
                color: #c9d1d9;
                text-decoration: none;
                font-size: 0.95rem;
                transition: background 0.15s, border-color 0.15s, transform 0.15s;
              }
              a:hover {
                background: rgba(0,217,255,0.08);
                border-color: #00d9ff;
                transform: translateX(4px);
                color: #fff;
              }
              .empty {
                color: #8b949e;
                font-size: 0.9rem;
                padding: 20px 0;
              }
              footer {
                margin-top: 40px;
                font-size: 0.8rem;
                color: #484f58;
                text-align: center;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Presentations</h1>
              <ul>
          $(printf "${ITEMS}")
              </ul>
              <footer>Roman Savitskyi · BeerJS Zhytomyr</footer>
            </div>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to gh-pages
        run: |
          cd gh-pages-repo

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add .

          # Перевіряємо чи є зміни
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy ${{ env.BRANCH_NAME }} branch

          Deployed from commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages

      - name: Output deployment URL
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "✅ Branch deployed to: https://${{ github.repository_owner }}.github.io/$REPO_NAME/${{ env.CLEAN_BRANCH }}/"
          echo "📋 Index: https://${{ github.repository_owner }}.github.io/$REPO_NAME/"
