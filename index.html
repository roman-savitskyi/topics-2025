<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentations — Roman Savitskyi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 680px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #00d9ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 16px;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }
    ul {
      list-style: none;
    }
    li {
      margin-bottom: 10px;
    }
    a {
      display: block;
      padding: 14px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    a:hover {
      background: rgba(0,217,255,0.08);
      border-color: #00d9ff;
      transform: translateX(4px);
      color: #fff;
    }
    .empty {
      color: #8b949e;
      font-size: 0.9rem;
      padding: 20px 0;
    }
    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #484f58;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Presentations</h1>
    <ul>
      <li><a href="css/">css</a></li>
      <li><a href="dist/">dist</a></li>

      <li><a href="feature-fw-days-chrome-dev-tools/">feature-fw/days-chrome-dev-tools</a></li>
      <li><a href="feature-km-ai/">feature-km/ai</a></li>
      <li><a href="js/">js</a></li>
      <li><a href="main/">main</a></li>
      <li><a href="plugin/">plugin</a></li>
    </ul>
    <footer>Roman Savitskyi · BeerJS Zhytomyr</footer>
  </div>
</body>
</html>
